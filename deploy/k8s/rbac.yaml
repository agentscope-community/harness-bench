# Bind this Role to the existing identity used by your local kubeconfig.
# No RoleBinding is guessed: choose a User/Group/ServiceAccount explicitly.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-bench-runner
  namespace: harness-bench
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [create, get, list, watch, delete, patch]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, patch, update, delete]
