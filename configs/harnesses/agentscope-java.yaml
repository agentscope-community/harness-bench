name: agentscope-java
import_path: hbench.agents:AgentScopeJava
supported_api_formats: [openai_chat_completions]
kwargs:
  version: 1.5.0
  # Pi defaults to 16384 for custom endpoints; keep the same ceiling.
  max_tokens: 16384
  # No step cap and no inner stream deadline: the Harbor trial timeout is the
  # only bound, matching the other two harnesses.
  turn_timeout_seconds: 0
  # Pi and Codex have no always-on memory extraction pipeline.
  disable_memory_hooks: true
  # 2.1 journals live under the evidence state dir; they never enter the
  # scored workspace.
  journal_enabled: true
  # Kernel defaults: one reminder when the model repeats an identical failing
  # tool call, and eviction of oversized tool results before the next request.
  repeated_failure_guard: true
  tool_result_eviction: true
  # Conservative evaluation setting, not a verified provider limit. A declared
  # window wins over name inference/LearnedContextWindows. Keep this setting
  # unchanged until the actual model limits are verified; record it in evidence.
  context_window_tokens: 131072
  # No temperature: use the server default like Pi and Codex.
  extra_body:
    enable_thinking: false
