<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231677ff'/%3E%3Cpath d='M9 22V10m0 6h14m0-6v12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

<body>
<div class="layout">
  <aside class="sider">
    <a class="brand" href="#/jobs">
